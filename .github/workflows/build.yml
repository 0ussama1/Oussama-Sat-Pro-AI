name: Build Oussama Sat APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer
      - name: Build with Buildozer
        run: |
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          # مسح التراخيص القديمة لإجبار النظام على استخدام NDK 25b الجديد
          rm -rf ~/.buildozer/android/platform/android-sdk/licenses
          buildozer android debug
        env:
          ACCEPT_SDK_LICENSE: "yes"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oussama-Sat-Pro-APK
          path: bin/*.apk
