name: Oussama Sat Master Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install System Ingredients
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev           libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev           lib32z1 lib32ncurses6 lib32stdc++6
          pip install --upgrade pip
          pip install buildozer cython==0.29.33

      - name: The Golden Build
        run: |
          # بناء نظيف ومباشر
          yes | buildozer android debug
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"

      - name: Deliver APK
        uses: actions/upload-artifact@v4
        with:
          name: Oussama-Sat-Final-App
          path: bin/*.apk
