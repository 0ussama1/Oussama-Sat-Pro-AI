name: Build & Sign APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.33
      - name: Build with buildozer
        run: |
          # قبول التراخيص بطريقة مباشرة ومتوافقة
          yes | sdkmanager --licenses || true
          buildozer android release
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
          # إضافة مسار الـ SDK لضمان التعرف على sdkmanager
          ANDROID_SDK_ROOT: "/home/runner/.buildozer/android/platform/android-sdk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Oussama-Sat-Pro-App
          path: bin/*.apk
