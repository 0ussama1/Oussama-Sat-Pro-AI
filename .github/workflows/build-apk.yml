name: Build & Sign APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release with the APK?"
  workflow_dispatch:
        required: false
        default: "false"
        type: boolean

jobs:
  build:
    name: Buildozer — Android Release APK
    runs-on: ubuntu-22.04
  workflow_dispatch:

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle / Android build tools) ───────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
  workflow_dispatch:
          distribution: "temurin"
  workflow_dispatch:

      # ── 3. Python ────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
  workflow_dispatch:

      # ── 4. System dependencies needed by python-for-android / Buildozer ──
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev

      # ── 5. Cache the Buildozer download cache (.buildozer) ───────────────
      #   This caches the Android SDK, NDK, and p4a bootstrap — saving
      #   15-25 min on every run after the first.
      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('python-kivy/buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 6. Cache pip packages ─────────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('python-kivy/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 7. Install Buildozer + Cython ─────────────────────────────────────
      - name: Install Buildozer and Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.5.0 Cython

      # ── 8. Restore keystore from GitHub Secret ────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > python-kivy/release.keystore
          echo "Keystore restored: $(stat -c%s python-kivy/release.keystore) bytes"

      # ── 9. Build release APK with Buildozer ───────────────────────────────
      - name: Build release APK
        working-directory: python-kivy
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          buildozer -v android release 2>&1 | tee build.log
          echo "==> Build output:"
          ls -lh bin/ || echo "No bin/ directory found — build may have failed."

      # ── 10. Sign the APK with apksigner ───────────────────────────────────
      - name: Sign APK
        working-directory: python-kivy
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          # Locate apksigner inside the SDK that Buildozer downloaded
          APKSIGNER=$(find ~/.buildozer/android/platform/android-sdk/build-tools \
            -name "apksigner" 2>/dev/null | sort -V | tail -1)
          echo "Using apksigner: $APKSIGNER"

          UNSIGNED=$(find bin/ -name "*-release-unsigned.apk" | head -1)
          SIGNED="${UNSIGNED/-unsigned/}"

          if [ -z "$UNSIGNED" ]; then
            echo "No unsigned APK found. Check build log above."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED" \
            "$UNSIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"
          echo "SIGNED_APK=$SIGNED" >> $GITHUB_ENV
          echo "✅ Signed APK: $SIGNED"

      # ── 11. Upload APK as workflow artifact ───────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oussama-sat-pro-ai-${{ github.sha }}
          path: python-kivy/bin/*.apk
          retention-days: 30

      # ── 12. Create GitHub Release on version tags (e.g. v1.0, v1.2.3) ────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: python-kivy/bin/*.apk
          name: "OUSSAMA SAT PRO AI ${{ github.ref_name }}"
          body: |
            ## OUSSAMA SAT PRO AI ${{ github.ref_name }}

            Signed release APK for Android — built automatically by GitHub Actions.

            ### Installation
            1. Enable **Install from unknown sources** on your Android device
            2. Download the `.apk` file below
            3. Open it on your device to install
            4. Connect your satellite receiver via USB OTG cable

            ### Requirements
            - Android 5.0+ (API 21)
            - USB OTG cable + compatible satellite receiver
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. Upload build log on failure ───────────────────────────────────
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: python-kivy/build.log
          retention-days: 7
